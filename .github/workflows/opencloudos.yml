name: OpenCloudOS Artifacts

on:
  # schedule:
    # - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenCloudOS Version'
        required: true
        default: '23'
      date:
        description: 'Containers Date'
        required: true
        default: '20241216'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Setup qemu-user-static
        run: docker run --rm --privileged ghcr.io/loong64/qemu-user-static --reset -p yes
      
      - name: Get Files
        run: |
          if [ ! -f "OpenCloudOS/rootfs.tar" ]; then
            wget -qO OpenCloudOS/rootfs.tar https://mirrors.opencloudos.tech/opencloudos-stream/releases/${{ github.event.inputs.version }}/images/loongarch64/OpenCloudOS-Stream-${{ github.event.inputs.version }}-${{ github.event.inputs.date }}-mini-docker-loongarch64.tar
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: OpenCloudOS
          platforms: linux/loong64
          provenance: false
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opencloudos:${{ github.event.inputs.version }}-stream
            ghcr.io/${{ github.repository_owner }}/opencloudos:${{ github.event.inputs.version }}-stream-${{ github.event.inputs.date }}
          outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Image
        run: docker run --rm ghcr.io/${{ github.repository_owner }}/opencloudos:${{ github.event.inputs.version }}-stream-${{ github.event.inputs.date }} uname -a